
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Customers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Dashboard</h2>
            <ul class="menu">
                <li onclick="showSection('customers')">Customers</li>
                <li>Orders</li>
                <li>Analytics</li>
                <li>Feedbacks</li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Customers Section -->
            <div id="customers" class="section">
                <h2>Customers</h2>

                <!-- Search Bar -->
                <div class="search-bar">
                    <input type="text" id="search-customers" placeholder="Search customers..." oninput="searchCustomers()">
                </div>

                <!-- Customer Table -->
                <table id="customer-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="customer-table-body">
                        <!-- Dynamic customer rows -->
                    </tbody>
                </table>

                <!-- Add Customer Button -->
                <button id="add-customer-btn" onclick="showAddCustomerModal()">Add Customer</button>

                <!-- Add/Edit Customer Modal -->
                <div id="customer-modal" class="modal">
                    <div class="modal-content">
                        <span class="close-modal" onclick="closeCustomerModal()">&times;</span>
                        <h3 id="modal-title">Add Customer</h3>
                        <form id="customer-form">
                            <label for="customer-name">Name:</label>
                            <input type="text" id="customer-name" required>
                            <label for="customer-email">Email:</label>
                            <input type="email" id="customer-email" required>
                            <label for="customer-phone">Phone:</label>
                            <input type="text" id="customer-phone" required>
                            <button type="button" onclick="saveCustomer()">Save</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
