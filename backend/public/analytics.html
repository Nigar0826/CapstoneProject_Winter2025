<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Analytics</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/analytics_style.css" >    
  
</head>
<body>
    <div class="container">
        <div class="header-section text-center">
          <h1>Sales Analytics</h1>
        </div>
        <!-- Total Sales and Total Orders Side by Side -->
        <div class="row mt-4">
          <div class="col-md-6">
            <div id="totalSales" class="summary card">
              <div class="card-header">Total Sales</div>
              <div class="card-body">
                <h2>$<span id="totalSalesAmount">0</span></h2>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div id="totalOrders" class="summary card">
              <div class="card-header">Total Orders</div>
              <div class="card-body">
                <h2><span id="totalOrdersCount">0</span></h2>
              </div>
            </div>
          </div>
        </div>
      
    
    <!-- Sales by Product Chart and Sales by Customer Chart Side by Side -->
<div class="row mt-4">
  <div class="col-md-6">
    <div class="card sales-analytics-card">
      <div class="card-header">Sales by Product Chart</div>
      <div class="card-body">
        <canvas id="salesByProductChart"></canvas>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card sales-analytics-card">
      <div class="card-header">Sales by Customer Chart</div>
      <div class="card-body">
        <canvas id="salesByCustomerChart"></canvas>
      </div>
    </div>
  </div>
</div>


 <!-- Sales by Month Chart and Sales by Month Table Side by Side -->
<div class="row mt-4">
  <div class="col-md-6">
    <div class="card sales-analytics-card">
      <div class="card-header">Sales by Month Chart</div>
      <div class="card-body">
        <canvas id="salesByMonthChart"></canvas>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div class="card sales-analytics-table">
      <div class="card-header">Sales by Month</div>
      <div class="card-body">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Month</th>
              <th>Sales</th>
            </tr>
          </thead>
          <tbody id="salesByMonthTable">
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Sales by Product Table and Sales by Customer Table Side by Side -->
<div class="row mt-4">
  <div class="col-md-6">
    <div id="salesByProduct" class="summary card sales-analytics-table">
      <div class="card-header">Sales by Product</div>
      <div class="card-body">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Product</th>
              <th>Sales</th>
            </tr>
          </thead>
          <tbody id="salesByProductTable">
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="col-md-6">
    <div id="salesByCustomer" class="summary card sales-analytics-table">
      <div class="card-header">Sales by Customer</div>
      <div class="card-body">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Customer</th>
              <th>Sales</th>
            </tr>
          </thead>
          <tbody id="salesByCustomerTable">
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>


  </div>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    $(document).ready(function() {
  $.ajax({
    url: '/api/analytics/sales-summary',
    method: 'GET',
    success: function(data) {
      $('#totalSalesAmount').text(data.totalSales[0].total_sales);
      $('#totalOrdersCount').text(data.totalOrders[0].total_orders);

      // Update sales by product table
      let salesByProductTable = '';
      data.salesByProduct.forEach(product => {
        salesByProductTable += `<tr><td>${product.name}</td><td>$${product.sales}</td></tr>`;
      });
      $('#salesByProductTable').html(salesByProductTable);

      // Update sales by customer table
      let salesByCustomerTable = '';
      data.salesByCustomer.forEach(customer => {
        salesByCustomerTable += `<tr><td>${customer.name}</td><td>$${customer.sales}</td></tr>`;
      });
      $('#salesByCustomerTable').html(salesByCustomerTable);

      // Create sales by product chart
      const productNames = data.salesByProduct.map(product => product.name);
      const productSales = data.salesByProduct.map(product => product.sales);

      const salesByProductChart = new Chart(document.getElementById('salesByProductChart'), {
        type: 'bar',
        data: {
          labels: productNames,
          datasets: [{
            label: 'Sales by Product',
            data: productSales,
            backgroundColor: [
                '#4CAF50', // Green
                '#FF5733', // Red
                '#337ab7', // Blue
                '#FFC300', // Yellow
                '#8A2BE2', // BlueViolet
                '#712a70', // HotPink
                '#7FFF00'  // Chartreuse
            ],
            borderColor: '#191970',
            borderWidth: 1
          }]
        },
        options: {
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });

      // Create sales by customer chart
      const customerNames = data.salesByCustomer.map(customer => customer.name);
      const customerSales = data.salesByCustomer.map(customer => customer.sales);

      const salesByCustomerChart = new Chart(document.getElementById('salesByCustomerChart'), {
        type: 'pie',
        data: {
          labels: customerNames,
          datasets: [{
            label: 'Sales by Customer',
            data: customerSales,
            backgroundColor: [
            'rgba(26, 82, 118, 0.8)',
            'rgba(104, 25, 33, 0.8)',
            'rgba(153, 128, 47, 0.8)',
            'rgba(78, 51, 129, 0.8)',
            'rgba(36, 96, 96, 0.8)',
            'rgba(153, 89, 32, 0.8)',
            'rgba(88, 34, 80, 0.8)',
            'rgba(47, 79, 79, 0.8)',
            'rgba(34, 139, 34, 0.8)',
            'rgba(106, 90, 205, 0.8)'
            ],
            borderColor: [
            'rgba(204, 49, 82, 1)',
            'rgba(6, 62, 98, 1)',
            'rgba(123, 98, 17, 1)',
            'rgba(6, 66, 66, 1)',
            'rgba(48, 21, 99, 1)',
            'rgba(123, 59, 2, 1)'
            ],
            borderWidth: 1
          }]
        }
      });

      // Update sales by month table
      let salesByMonthTable = '';
      data.salesByMonth.forEach(month => {
        salesByMonthTable += `<tr><td>${month.month}</td><td>$${month.sales}</td></tr>`;
      });
      $('#salesByMonthTable').html(salesByMonthTable);

      // Create sales by month chart
      const months = data.salesByMonth.map(month => month.month);
      const monthSales = data.salesByMonth.map(month => month.sales);

      const salesByMonthChart = new Chart(document.getElementById('salesByMonthChart'), {
        type: 'line',
        data: {
          labels: months,
          datasets: [{
            label: 'Sales by Month',
            data: monthSales,
            backgroundColor: 'rgba(75, 192, 192, 0.2)',
            borderColor: 'rgba(75, 192, 192, 1)',
            borderWidth: 1
          }]
        },
        options: {
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    },
    error: function(error) {
      console.error('Error fetching analytics data:', error);
    }
  });
});
  </script>
</body>
</html>
