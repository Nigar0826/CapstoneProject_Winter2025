<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stripe Payment</title>
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
    <form id="payment-form">
        <label for="amount">Enter Payment Amount:</label>
        <input type="number" id="amount" name="amount" placeholder="Enter amount in CAD" required>

        <div id="card-number"><!-- Card number field --></div>
        <div id="card-expiry"><!-- Expiry field --></div>
        <div id="card-cvc"><!-- CVC field --></div>

        <button id="submit">Pay</button>
    </form>

    <script src="js/payment.js"></script>
</body>
</html>
