<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Product Catalog</title>
   <!-- <link rel="stylesheet" href="css/style.css" />-->
  <link rel="stylesheet" href="css/catalog.css" />
  <script defer src="js/catalogadmin.js"></script>
</head>
<body>
  <!-- Admin Dashboard Layout -->
  <div id="dashboard-layout">
    <div class="dashboard">
      <!-- Sidebar Navigation -->
      <div class="sidebar">
        <h2>Dashboard</h2>
        <ul class="menu">
          <li><a href="/admin">Profile</a></li>
          <li><a href="/admin">Customers</a></li>
          <li><a href="/admin">Payments</a></li>
          <li><a href="/admin">Orders</a></li>
          <li><a href="catalogadmin.html">Catalog</a></li>
          <li><a href="analytics.html">Analytics</a></li>
          <li><a href="/admin">Feedbacks</a></li>
        </ul>
      </div>

      <!-- Main Content -->
      <div id="catalogadmin" class="main-content"> 
        <div class="section">
          <h2>Catalog</h2>

          <!-- Search Bar -->
          <input
            type="text"
            id="search-bar"
            placeholder="Search for products..."
            oninput="searchProducts()"
            style="width: 100%; padding: 10px; margin-bottom: 20px;"
          />

          <!-- Product List -->
          <table id="product-table" class="product-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Price</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="product-table-body"></tbody>
          </table>          

          <!-- Add Product Button -->
          <button id="add-product-btn">Add New Product</button>

          <!-- Modal -->
          <div id="product-modal" class="modal">
            <div class="modal-content">
              <span class="close-modal" onclick="closeProductModal()">&times;</span>
              <h3>Add New Product</h3>
              <form id="add-product-form">
                <input type="text" id="product-name" placeholder="Product Name" required />
                <input type="text" id="product-description" placeholder="Description" required />
                <input type="number" id="product-price" placeholder="Price" required />
                <button type="submit">Add Product</button>
              </form>
            </div>
          </div>
  
            <!-- Edit Product -->
            <div id="edit-product-modal" class="modal">
              <div class="modal-content">
                <span class="close-modal" onclick="closeEditProductModal()">&times;</span>
                <h3>Edit Product</h3>
                <form id="edit-product-form">
                  <input type="hidden" id="edit-product-id" />
                  <input type="text" id="edit-product-name" placeholder="Product Name" required />
                  <input type="text" id="edit-product-description" placeholder="Description" required />
                  <input type="number" id="edit-product-price" placeholder="Price" required />
                  <button type="submit">Update Product</button>
                </form>
              </div>
            </div>
  
            <!-- Delete Product -->
            <div id="delete-product-modal" class="modal">
              <div class="modal-content">
                <span class="close-modal" onclick="closeDeleteProductModal()">&times;</span>
                <h3>Delete Product</h3>
                <p>Are you sure you want to delete this product?</p>
                <form id="delete-product-form">
                  <input type="hidden" id="delete-product-id" />
                  <button type="submit">Delete Product</button>
                </form>
              </div>
            </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
