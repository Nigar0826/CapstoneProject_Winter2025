<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homepage</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/homepage_styles.css">
</head>
<body>
  
  <!-- Header Section -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Biz Horizon</a>
      <div class="d-flex">
        <form action="http://localhost:4000/api/users/register" method="get">
          <button type="submit" class="btn btn-outline-light mx-1">Register</button>
        </form>     
        <form action="http://localhost:4000/api/users/login" method="get">
          <button type="submit" class="btn btn-outline-light mx-1">Login</button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <div class="container my-4">
    <div id="offerCarousel" class="carousel slide" data-bs-ride="carousel" style="max-width: 400px; margin: 0 auto;">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="../assets/carousel1.jpg" class="d-block w-100" alt="Offer 1">
          <div class="carousel-caption">
            <h5>50% Off on Products!</h5>
            <button class="btn btn-primary">Shop Now</button>
          </div>
        </div>
        <div class="carousel-item">
          <img src="../assets/carousel2.jpg" class="d-block w-100" alt="Offer 2">
          <div class="carousel-caption">
            <h5>Buy One Get One Free!</h5>
            <button class="btn btn-primary">Shop Now</button>
          </div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#offerCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#offerCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </div>
